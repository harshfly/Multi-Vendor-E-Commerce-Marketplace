name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haat
          POSTGRES_PASSWORD: haat
          POSTGRES_DB: haat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @haat/shared build

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate
        env:
          DATABASE_URL: postgresql://haat:haat@localhost:5432/haat?schema=public

      - name: Build Web
        run: pnpm --filter web build

      - name: Build API
        run: pnpm --filter api build

      - name: Run Test Suite
        run: pnpm --filter api test
        env:
          DATABASE_URL: postgresql://haat:haat@localhost:5432/haat?schema=public
          JWT_ACCESS_SECRET: test-secret-key-32-chars-long-minimum!
          JWT_REFRESH_SECRET: test-secret-key-32-chars-long-minimum!
          PAYMENT_PROVIDER: fake
          SEARCH_DRIVER: pg

